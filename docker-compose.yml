services:
  db_server:
    image: postgres:15

    container_name: my_test_postgres
    env_file:
    - app/settings/.env

    environment: 
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - LANG=C.UTF-8

    ports: 
    - "5432:5432"
  
    volumes: 
    - pgdata:/var/lib/postgresql/data 
  api:
    build: .
    container_name: myapp
    ports:
      - "8000:8000"
    env_file:
      - app/settings/.env
    environment:
      - DB_HOST=db_server
    depends_on:
      - db_server
    restart: always

    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata: